services:
  api:
    image: ghcr.io/steel-dev/steel-browser-api:latest
    expose:
      - 3000
      - 9223
    volumes:
      - ./.cache:/app/.cache
    environment:
      - NODE_ENV=development
    networks:
      - steel-network

  ui:
    image: ghcr.io/steel-dev/steel-browser-ui:latest
    expose:
      - 5173
    depends_on:
      - api
    networks:
      - steel-network

networks:
  steel-network:
    name: steel-network
    driver: bridge

services:
  api:
    platform: linux/amd64
    build:
      context: .
      dockerfile: ./api/Dockerfile
      args:
        NODE_VERSION: 22.13.0
    expose:
      - 3000
      - 9223
    ports:
      - 9223:9223
    volumes:
      - ./.cache:/app/.cache
    environment:
      - HOST=${API_HOST:-steel-api.lab}
    extra_hosts:
      - "steel-api.lab:127.0.0.1"
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/documentation"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - steel-network
      - utils

  ui:
    build:
      context: .
      dockerfile: ./ui/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://api:3000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://api:3000}
        VITE_OPENAPI_URL: ${VITE_OPENAPI_URL:-http://api:3000/documentation/json}
    expose:
      - 5173
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://api:3000}
      - VITE_WS_URL=${VITE_WS_URL:-ws://api:3000}
      - VITE_OPENAPI_URL=${VITE_OPENAPI_URL:-http://api:3000/documentation/json}
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:5173"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - api
    networks:
      - steel-network
      - utils
networks:
  steel-network:
    name: steel-network
    driver: bridge
  utils:
    external: true
